<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ĐĂNG KÝ NHẬN TƯ VẤN</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Lobster&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Roboto', serif;
      display:flex; 
      align-items:center; 
      justify-content:center;
      min-height:100vh; 
      margin:0;
      background: url("bg.png") no-repeat center center fixed;
      background-size: cover;
      position: relative;
    }

    .logo {
      position:absolute;
      top:20px;
      left:20px;
    }
    .logo img {
      width:150px;
    }

    .form-card {
      background:#fbf5de;
      width:500px;
      padding:30px 25px;
      border-radius:20px;
      box-shadow:0 8px 20px rgba(0,0,0,0.2);
      text-align:center;
    }

    .form-card h2 {
      font-family: "Lobster", Sans-serif;
      font-size: 35px;
      font-weight:bold;
      color:#dd1e1d;
      margin:0 0 12px 0;
      letter-spacing:0.04em; /* giãn cách chữ */
    }

    .form-card p {
      font-size:15px;
      margin:0 0 20px 0;
      color:#555;
    }

    .form-card input {
      font-family: 'Roboto', serif;
      font-size:15px;
      color:#000000;
      width:95%; 
      padding:12px 14px;
      margin:10px 0;
      border:1px solid #ddd;
      border-radius:25px;
      outline:none;
      background:#fbfbfb;
    }

    .form-card button {
      font-family: 'Roboto', serif;
      font-size:20px;
      font-weight:bold;
      background:#dd1e1d;
      color:#fff;
      border:none;
      padding:10px 0;
      border-radius:25px;
      cursor:pointer;
      margin-top:10px;
      width:40%; /* 1/3 ô input */
    }

    .form-card button:hover {
      background:#d63013;
    }

    .form-card small {
      font-family: 'Roboto', cursive;
      display:block;
      font-size:13px;
      color:#777;
      margin-top:15px;
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="logo smart.png">
  </div>

  <div class="form-card">
    <h2>Đăng ký nhận tư vấn</h2>
    <p>Quý khách vui lòng để lại thông tin, chúng tôi sẽ liên hệ tư vấn</p>
    <form id="submit-form" method="POST" target="hidden_iframe">
      <input type="text" name="name" placeholder="Họ và tên" required>
      <br>
      <input type="text" name="phone" placeholder="Số điện thoại" required>
      <br>
      <button type="submit">Đăng ký</button>
    </form>
    <small>Thông tin chỉ dùng để liên hệ tư vấn — bảo mật theo chính sách công ty.</small>
  </div>

  <!-- iframe ẩn để chống reload trang -->
  <iframe name="hidden_iframe" style="display:none;"></iframe>

<script>
document.querySelector("form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const formData = new FormData(e.target);

  try {
    const response = await fetch("https://script.google.com/macros/s/AKfycbzO8UixcJBHZb6VKpY3TOox0INXtyU6KH2Unvm5qu7sGRFr_Ks_2HXL3qXP2RGmWs1h/exec", {
      method: "POST",
      body: formData
    });

    const result = await response.json();

    if (result.result === "success") {
      alert("Đăng ký thành công! Chúng tôi sẽ liên hệ với bạn.");
      e.target.reset();
    } else {
      alert("Có lỗi xảy ra: " + result.message);
    }
  } catch (err) {
    alert("Không kết nối được: " + err.message);
  }
});
</script>
</body>
</html>
